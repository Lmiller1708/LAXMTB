<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LAX MTB Race Central</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // GitHub Pages SPA deep link router
    (function() {
      var path = window.location.pathname;
      var isGithubPagesSubdir = window.location.hostname.indexOf('github.io') !== -1;
      var repoName = isGithubPagesSubdir ? '/LAXMTB' : '';
      var relative = path;
      if (repoName && relative.indexOf(repoName) === 0) {
        relative = relative.substring(repoName.length);
      }
      var cleanPath = relative.replace(/^\/+|\/+$/g, '');
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      
      var target = (repoName ? repoName : '') + '/#/' + cleanPath + search + hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body style="background:#0a0a0a;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div style="text-align:center;padding:20px;">
    <div style="font-size:32px;margin-bottom:12px;">🚵</div>
    <h2 style="font-size:18px;font-weight:700;margin:0 0 8px 0;">Loading LAX MTB Race Central...</h2>
    <p style="font-size:13px;color:#888888;margin:0;">Redirecting to your requested race page...</p>
  </div>
</body>
</html>
