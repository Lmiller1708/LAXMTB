<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAX MTB | Bluff Bash Live Race Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Bungee&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: #12161f;
      --bg-card-hover: #181e2b;
      --border-color: rgba(255, 255, 255, 0.08);
      --lax-red: #e52b2b;
      --lax-red-hover: #ff3b3b;
      --lax-red-glow: rgba(229, 43, 43, 0.35);
      --trail-orange: #f97316;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --plate-bg: #1e2533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(229, 43, 43, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(249, 115, 22, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #07090c 0%, #0d1017 100%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.4;
      padding-bottom: 60px;
    }

    /* Top Hero Header */
    .hero-header {
      background: linear-gradient(180deg, rgba(18, 22, 31, 0.95) 0%, rgba(10, 12, 16, 0.98) 100%);
      border-bottom: 2px solid rgba(229, 43, 43, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .hero-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #e52b2b, #f97316, #e52b2b);
    }

    .hero-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 20px 0 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .team-logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(229, 43, 43, 0.4));
      background: rgba(255, 255, 255, 0.06);
      border-radius: 50%;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .title-group h1 {
      font-family: 'Teko', sans-serif;
      font-size: 38px;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .title-group h1 span {
      color: var(--lax-red);
    }

    .title-group .event-subtext {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-group .event-subtext span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Live Badge Pill */
    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 6px;
    }

    .nav-tab {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tab:hover {
      color: #fff;
    }

    .nav-tab.active {
      color: #fff;
    }

    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--lax-red), #f97316);
      box-shadow: 0 0 12px var(--lax-red-glow);
    }

    /* Main Content */
    .main-content {
      max-width: 1240px;
      margin: 24px auto 0 auto;
      padding: 0 16px;
    }

    /* Control & Filter Panel */
    .controls-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .top-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--lax-red), #c81e1e);
      border: none;
      color: #fff;
      box-shadow: 0 4px 12px var(--lax-red-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--lax-red-hover), #dc2626);
      transform: translateY(-1px);
    }

    .search-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-input {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      width: 270px;
      outline: none;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--lax-red);
      box-shadow: 0 0 10px var(--lax-red-glow);
    }

    .filter-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .select-dropdown {
      padding: 8px 14px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      background-color: rgba(10, 14, 20, 0.9);
      color: #f1f5f9;
      outline: none;
      min-width: 200px;
      cursor: pointer;
    }

    .select-dropdown:focus {
      border-color: var(--lax-red);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .highlight-stat {
      color: #fff;
      font-weight: 700;
    }

    /* Table & Card Components */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      transition: transform 0.15s ease;
    }

    .category-header-bar {
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
      padding: 12px 18px 8px 18px;
      background: linear-gradient(90deg, #161c28 0%, #10141d 100%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-count-badge {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(255,255,255,0.06);
      padding: 2px 10px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }

    .wave-header {
      background: linear-gradient(90deg, #e52b2b 0%, #f97316 100%);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.2);
    }

    .team-header-bar {
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      font-family: 'Teko', sans-serif;
      font-size: 22px;
      letter-spacing: 0.8px;
      padding: 10px 18px 6px 18px;
      border-left: 4px solid var(--lax-red);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    .results-table th {
      background-color: rgba(10, 14, 20, 0.7);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .results-table td {
      padding: 11px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      white-space: nowrap;
    }

    .results-table tr:last-child td {
      border-bottom: none;
    }

    .results-table tr:hover td {
      background-color: var(--bg-card-hover);
      color: #ffffff;
    }

    /* Plate Number Chip */
    .plate-number {
      display: inline-block;
      font-family: 'Teko', sans-serif;
      font-size: 18px;
      line-height: 1;
      font-weight: 700;
      padding: 3px 10px;
      background: #182030;
      color: #ffffff;
      border-radius: 4px;
      border-top: 2px solid var(--lax-red);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      min-width: 44px;
      text-align: center;
    }

    .rider-name {
      font-weight: 700;
      color: #ffffff;
      font-size: 14px;
    }

    .team-badge {
      display: inline-block;
      font-size: 12px;
      color: #94a3b8;
    }

    .team-badge-highlight {
      color: #f1f5f9;
      font-weight: 600;
    }

    .div-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .status-badge {
      color: var(--lax-red);
      font-weight: 800;
    }

    .no-results {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }

    .loading-state {
      padding: 50px 20px;
      text-align: center;
      color: #94a3b8;
      font-size: 15px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }

    .notice-box {
      background: rgba(229, 43, 43, 0.08);
      border: 1px solid rgba(229, 43, 43, 0.25);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #fca5a5;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .hero-top-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .search-input {
        width: 100%;
      }
      .search-group {
        width: 100%;
      }
      .select-dropdown {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Top Hero Banner -->
  <header class="hero-header">
    <div class="hero-container">
      <div class="hero-top-row">
        
        <div class="brand-section">
          <img src="logo.png" alt="La Crosse Area MTB Team" class="team-logo" onerror="this.style.display='none'">
          <div class="title-group">
            <h1>LAX MTB <span>// RACE CENTRAL</span></h1>
            <div class="event-subtext">
              <span>🚵 Bluff Bash (North Conference)</span>
              <span>📅 09/05/2026</span>
              <span>📍 Marshfield, WI</span>
            </div>
          </div>
        </div>

        <div>
          <span class="live-status-pill">
            <span class="pulse-dot" id="liveDot"></span>
            <span id="liveStatusText">Connecting...</span>
          </span>
        </div>

      </div>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs">
        <div class="nav-tab active" id="tabStartLists" onclick="switchTab('list')">
          <span>🏁</span> Start Lists
        </div>
        <div class="nav-tab inactive" id="tabLiveResults" onclick="switchTab('results')">
          <span>⏱️</span> Live Race Results
        </div>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <div id="noticeContainer"></div>
    
    <!-- Controls & Filters Panel -->
    <div class="controls-panel">
      <div class="top-toolbar">
        <div class="toolbar-left">
          <button class="btn-action btn-primary" onclick="fetchLiveRaceresultData()">
            <span id="refreshIcon">🔄</span> Refresh
          </button>
          <button class="btn-action" onclick="window.print()">
            <span>📄</span> Print / PDF
          </button>
          <div style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;">
            <span>Auto-Refresh:</span>
            <select id="autoRefreshInterval" class="select-dropdown" style="min-width:110px;padding:4px 8px;" onchange="setupAutoRefresh()">
              <option value="0">Off</option>
              <option value="15">Every 15s</option>
              <option value="30" selected>Every 30s</option>
              <option value="60">Every 60s</option>
            </select>
          </div>
        </div>

        <div class="search-group">
          <input type="text" id="searchInput" class="search-input" placeholder="Search rider, plate #, team..." oninput="renderData()">
          <button class="btn-action" onclick="clearSearch()">✕</button>
        </div>
      </div>

      <div class="filter-row">
        <!-- List View Dropdown -->
        <select id="listSelect" class="select-dropdown" onchange="onListDropdownChange()">
          <option value="22E0EB">Rider List - By Category & Wave</option>
          <option value="747B52">Rider List - By Team</option>
        </select>

        <!-- Category Dropdown -->
        <select id="categoryFilter" class="select-dropdown" onchange="renderData()">
          <option value="ALL">&lt;All Categories&gt;</option>
        </select>

        <!-- Team Dropdown -->
        <select id="teamFilter" class="select-dropdown" onchange="renderData()">
          <option value="DEFAULT_TEAMS">All LAX Area Teams (La Crosse, Holmen, La Crescent)</option>
          <option value="ALL">&lt;Show All 44 Event Teams&gt;</option>
        </select>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="statusCount">Loading live data...</span>
      <span id="lastUpdatedText">Syncing with RACE RESULT...</span>
    </div>

    <!-- Data Tables Container -->
    <div id="tablesContainer">
      <div class="loading-state">Connecting to RACE RESULT Live API...</div>
    </div>

  </main>

      if (tab === 'list') {
        listDropdown.innerHTML = `
          <option value="22E0EB">Rider List - By Category & Wave</option>
          <option value="747B52">Rider List - By Team</option>
        `;
      } else {
        listDropdown.innerHTML = `
          <option value="4C8C1F">Individual Results - ALL</option>
          <option value="E07F7C">Individual Results - By Team</option>
          <option value="674D5B">Team Results</option>
        `;
      }
      fetchLiveRaceresultData();
    }

    function onListDropdownChange() {
      fetchLiveRaceresultData();
    }

    async function fetchLiveRaceresultData() {
      const selectedListId = document.getElementById('listSelect').value;
      currentListMode = (selectedListId === '747B52' || selectedListId === 'E07F7C') ? 'TEAM' : 'WAVE';

      try {
        const configResp = await fetch(`https://my.raceresult.com/${EVENT_ID}/${currentTab}/config?lang=en`);
        if (!configResp.ok) throw new Error(`Config HTTP ${configResp.status}`);
        const config = await configResp.json();
        const key = config.key;

        const lists = config?.TabConfig?.Lists || [];
        const targetList = lists.find(l => l.ID === selectedListId) || lists[0];
        const listName = targetList ? targetList.Name : '';

        const params = new URLSearchParams({
          key: key,
          listname: listName,
          page: currentTab,
          contest: '0',
          r: 'all',
          l: '0'
        });

        const listResp = await fetch(`https://my.raceresult.com/${EVENT_ID}/${currentTab}/list?` + params.toString());
        if (!listResp.ok) throw new Error(`List HTTP ${listResp.status}`);
        const resultData = await listResp.json();

        parseUniversalData(resultData, targetList);

        document.getElementById('liveDot').style.backgroundColor = '#10b981';
        document.getElementById('liveStatusText').textContent = 'Live API Connected';
        document.getElementById('lastUpdatedText').textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (err) {
        console.warn('Live fetch error, falling back to snapshot:', err);
        document.getElementById('liveDot').style.backgroundColor = '#f59e0b';
        document.getElementById('liveStatusText').textContent = 'Cached Snapshot';
        document.getElementById('lastUpdatedText').textContent = 'Snapshot Data';
        
        if (currentTab === 'list') {
          currentRiders = fallbackSnapshot;
          populateFilterDropdowns();
          renderData();
        } else {
          renderNoResultsNotice('Live race results will stream in real-time on race day (09/05/2026).');
        }
      }
    }

    function parseUniversalData(resultData, listInfo) {
      const rawData = resultData?.data;
      const listId = listInfo?.ID || document.getElementById('listSelect').value;

      if (Array.isArray(rawData) && rawData.length === 0 && currentTab === 'results') {
        renderNoResultsNotice('No race finishes recorded yet for this event. Results and lap times will appear live on race day (09/05/2026).');
        currentRiders = [];
        return;
      }

      document.getElementById('noticeContainer').innerHTML = '';
      const extracted = [];

      function traverse(node, context) {
        if (node && typeof node === 'object' && !Array.isArray(node)) {
          for (const [key, val] of Object.entries(node)) {
            const cleanKey = key.includes('_') ? key.split('_').slice(1).join('_') : key;
            const newCtx = { ...context };

            if (cleanKey.includes('Wave')) {
              newCtx.wave = cleanKey;
            } else if (categoryOrder.some(c => cleanKey.includes(c)) || cleanKey.includes('Boys') || cleanKey.includes('Girls') || cleanKey.includes('Open')) {
              newCtx.category = cleanKey;
            } else if (cleanKey.includes('School') || cleanKey.includes('Composite') || cleanKey.includes('Team') || cleanKey.includes('Cycling') || cleanKey.includes('Spooner')) {
              newCtx.team = cleanKey.replace(/\s*\(Division\s*\d+\)/i, '').trim();
            }
            traverse(val, newCtx);
          }
        } else if (Array.isArray(node)) {
          node.forEach(row => {
            if (Array.isArray(row) && row.length >= 4) {
              let rider = { ...context };

              if (listId === '747B52') {
                rider.bib = row[1] || '';
                rider.no = row[1] || '';
                rider.name = row[2] || '';
                rider.gender = row[3] || '';
                rider.category = row[4] || rider.category || '';
                rider.wave = rider.wave || 'Wave: 1';
                rider.div = rider.team && rider.team.includes('Division 1') ? '1' : '2';
                rider.wv = '1';
                rider.wv_rank = '1';
                rider.return_val = '+';
              } else {
                rider.no = row[0] || '';
                rider.bib = row[1] || '';
                rider.pl = row[2] || '';
                rider.name = row[3] || '';
                rider.team = row[4] || rider.team || '';
                rider.div = row[5] || '1';
                rider.wv = row[6] || '1';
                rider.wv_rank = row[2] || '';
                rider.return_val = row[7] || '+';
              }

              if (rider.name && rider.team) {
                extracted.push(rider);
              }
            } else if (typeof row === 'object') {
              traverse(row, context);
            }
          });
        }
      }

      traverse(rawData, {});

      currentRiders = extracted.length > 0 ? extracted : fallbackSnapshot;
      populateFilterDropdowns();
      renderData();
    }

    function renderNoResultsNotice(msg) {
      document.getElementById('noticeContainer').innerHTML = `
        <div class="notice-box">
          <span style="font-size:18px;">ℹ️</span>
          <span>${msg}</span>
        </div>
      `;
      document.getElementById('tablesContainer').innerHTML = `
        <div class="no-results">
          <h3 style="color:#fff;font-size:18px;">No Results Recorded Yet</h3>
          <p style="margin-top:8px;color:#94a3b8;">The race has not started yet. Switch to <strong>Start Lists</strong> to view wave placements and rider plate numbers.</p>
        </div>
      `;
      document.getElementById('statusCount').textContent = '0 results recorded';
    }

    function populateFilterDropdowns() {
      const catSelect = document.getElementById('categoryFilter');
      const prevCat = catSelect.value;
      const categories = [...new Set(currentRiders.map(r => r.category).filter(Boolean))].sort((a, b) => {
        let ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      catSelect.innerHTML = '<option value="ALL">&lt;All Categories&gt;</option>';
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        catSelect.appendChild(opt);
      });
      if (categories.includes(prevCat)) catSelect.value = prevCat;

      const teamSelect = document.getElementById('teamFilter');
      const prevTeam = teamSelect.value;
      const teams = [...new Set(currentRiders.map(r => r.team).filter(Boolean))].sort();

      teamSelect.innerHTML = `
        <option value="DEFAULT_TEAMS">All LAX Area Teams (La Crosse, Holmen, La Crescent)</option>
        <option value="ALL">&lt;Show All ${teams.length} Event Teams&gt;</option>
      `;
      teams.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        teamSelect.appendChild(opt);
      });
      if (prevTeam && (prevTeam === 'DEFAULT_TEAMS' || prevTeam === 'ALL' || teams.includes(prevTeam))) {
        teamSelect.value = prevTeam;
      }
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      renderData();
    }

    function renderData() {
      if (currentRiders.length === 0) return;

      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCat = document.getElementById('categoryFilter').value;
      const selectedTeam = document.getElementById('teamFilter').value;

      const filtered = currentRiders.filter(r => {
        if (selectedCat !== 'ALL' && r.category !== selectedCat) return false;

        if (selectedTeam === 'DEFAULT_TEAMS') {
          const isTarget = targetTeamKeywords.some(kw => r.team && r.team.toLowerCase().includes(kw));
          if (!isTarget) return false;
        } else if (selectedTeam !== 'ALL') {
          if (r.team !== selectedTeam) return false;
        }

        if (query) {
          const match = (r.name && r.name.toLowerCase().includes(query)) ||
                        (r.no && r.no.toLowerCase().includes(query)) ||
                        (r.bib && r.bib.toLowerCase().includes(query)) ||
                        (r.team && r.team.toLowerCase().includes(query)) ||
                        (r.category && r.category.toLowerCase().includes(query)) ||
                        (r.wave && r.wave.toLowerCase().includes(query));
          if (!match) return false;
        }
        return true;
      });

      document.getElementById('statusCount').innerHTML = `Showing <span class="highlight-stat">${filtered.length}</span> of <span class="highlight-stat">${currentRiders.length}</span> riders`;

      const container = document.getElementById('tablesContainer');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">No riders matched your current search / filter.</div>';
        return;
      }

      if (currentListMode === 'TEAM') {
        renderGroupedByTeam(filtered, container);
      } else {
        renderGroupedByCategoryWave(filtered, container);
      }
    }

    function renderGroupedByCategoryWave(riders, container) {
      const grouped = {};
      riders.forEach(r => {
        const cat = r.category || 'General';
        const wave = r.wave || 'Wave: 1';
        if (!grouped[cat]) grouped[cat] = {};
        if (!grouped[cat][wave]) grouped[cat][wave] = [];
        grouped[cat][wave].push(r);
      });

      const sortedCatKeys = Object.keys(grouped).sort((a, b) => {
        let ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      sortedCatKeys.forEach(cat => {
        const catCard = document.createElement('div');
        catCard.className = 'table-card';

        const totalInCat = Object.values(grouped[cat]).reduce((acc, list) => acc + list.length, 0);

        const catTitle = document.createElement('div');
        catTitle.className = 'category-header-bar';
        catTitle.innerHTML = `
          <span>${cat}</span>
          <span class="category-count-badge">${totalInCat} RIDERS</span>
        `;
        catCard.appendChild(catTitle);

        const waves = grouped[cat];
        const sortedWaveKeys = Object.keys(waves).sort();

        sortedWaveKeys.forEach(wKey => {
          const waveHeader = document.createElement('div');
          waveHeader.className = 'wave-header';
          waveHeader.innerHTML = `<span>🚩</span> ${wKey.includes('Wave') ? wKey : `Wave: ${wKey}`}`;
          catCard.appendChild(waveHeader);

          const table = document.createElement('table');
          table.className = 'results-table';
          table.innerHTML = `
            <thead>
              <tr>
                <th style="width:50px;">PL</th>
                <th style="width:70px;">Plate #</th>
                <th>Rider Name</th>
                <th>Team / School</th>
                <th style="text-align:center;width:60px;">Div</th>
                <th style="text-align:center;width:60px;">Wave</th>
                <th style="text-align:center;width:60px;">Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          `;

          const tbody = table.querySelector('tbody');
          const ridersInWave = waves[wKey].sort((a, b) => {
            const pa = parseInt(a.pl) || parseInt(a.bib) || 0;
            const pb = parseInt(b.pl) || parseInt(b.bib) || 0;
            return pa - pb;
          });

          ridersInWave.forEach(r => {
            const isTarget = targetTeamKeywords.some(kw => r.team && r.team.toLowerCase().includes(kw));
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td style="color:#94a3b8;font-weight:600;">${r.pl || '-'}</td>
              <td><span class="plate-number">#${r.no || r.bib}</span></td>
              <td><span class="rider-name">${r.name}</span></td>
              <td><span class="team-badge ${isTarget ? 'team-badge-highlight' : ''}">${r.team}</span></td>
              <td style="text-align:center;"><span class="div-badge">D${r.div || '1'}</span></td>
              <td style="text-align:center;color:#94a3b8;">${r.wv || '1'}</td>
              <td style="text-align:center;" class="status-badge">${r.return_val || '+'}</td>
            `;
            tbody.appendChild(tr);
          });

          catCard.appendChild(table);
        });

        container.appendChild(catCard);
      });
    }

    function renderGroupedByTeam(riders, container) {
      const grouped = {};
      riders.forEach(r => {
        const team = r.team || 'Independent';
        if (!grouped[team]) grouped[team] = [];
        grouped[team].push(r);
      });

      const sortedTeams = Object.keys(grouped).sort();

      sortedTeams.forEach(team => {
        const teamCard = document.createElement('div');
        teamCard.className = 'table-card';

        const teamHeader = document.createElement('div');
        teamHeader.className = 'team-header-bar';
        teamHeader.innerHTML = `
          <span>${team}</span>
          <span class="category-count-badge">${grouped[team].length} RIDERS</span>
        `;
        teamCard.appendChild(teamHeader);

        const table = document.createElement('table');
        table.className = 'results-table';
        table.innerHTML = `
          <thead>
            <tr>
              <th style="width:70px;">Plate #</th>
              <th>Rider Name</th>
              <th>Category</th>
              <th style="text-align:center;width:60px;">Div</th>
              <th style="text-align:center;width:80px;">Wave</th>
              <th style="text-align:center;width:60px;">Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;

        const tbody = table.querySelector('tbody');
        const teamRiders = grouped[team].sort((a, b) => {
          let ia = categoryOrder.indexOf(a.category), ib = categoryOrder.indexOf(b.category);
          if (ia === -1) ia = 99;
          if (ib === -1) ib = 99;
          if (ia !== ib) return ia - ib;
          return (a.name || '').localeCompare(b.name || '');
        });

        teamRiders.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="plate-number">#${r.bib || r.no}</span></td>
            <td><span class="rider-name">${r.name}</span></td>
            <td><span style="color:#f1f5f9;font-weight:600;">${r.category || ''}</span></td>
            <td style="text-align:center;"><span class="div-badge">D${r.div || '1'}</span></td>
            <td style="text-align:center;color:#94a3b8;">${r.wave || 'Wave 1'}</td>
            <td style="text-align:center;" class="status-badge">${r.return_val || '+'}</td>
          `;
          tbody.appendChild(tr);
        });

        teamCard.appendChild(table);
        container.appendChild(teamCard);
      });
    }

    function setupAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      const intervalSec = parseInt(document.getElementById('autoRefreshInterval').value, 10);
      if (intervalSec > 0) {
        autoRefreshTimer = setInterval(fetchLiveRaceresultData, intervalSec * 1000);
      }
    }

    fetchLiveRaceresultData();
    setupAutoRefresh();
  </script>
</body>
</html>
