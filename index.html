<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>LAX MTB | Race Central</title>
  
  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAX MTB">
  <meta name="theme-color" content="#0d0d0d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Strict Pure Black & Neutral Gray Palette */
    :root[data-theme="dark"] {
      --bg-body: #0d0d0d;
      --bg-header: #141414;
      --bg-card: #181818;
      --bg-card-hover: #222222;
      --bg-subtle: #202020;
      --border: #2c2c2c;
      --border-strong: #3f3f3f;
      --text-main: #f5f5f5;
      --text-muted: #9e9e9e;
      --text-dim: #707070;
      
      --accent-red: #ef4444;
      --accent-red-hover: #dc2626;
      --accent-red-subtle: rgba(239, 68, 68, 0.12);
      
      --wave-bg: #1c1c1c;
      --wave-text: #f5f5f5;
      --wave-border: #ef4444;
      
      --plate-bg: #242424;
      --plate-text: #ffffff;
      --plate-border: #3d3d3d;
      
      --race-tab-active-bg: #222222;
      --race-tab-active-border: #ef4444;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    :root[data-theme="light"] {
      --bg-body: #f4f4f4;
      --bg-header: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f9f9f9;
      --bg-subtle: #efefef;
      --border: #dedede;
      --border-strong: #cccccc;
      --text-main: #141414;
      --text-muted: #666666;
      --text-dim: #888888;
      
      --accent-red: #dc2626;
      --accent-red-hover: #b91c1c;
      --accent-red-subtle: rgba(220, 38, 38, 0.08);
      
      --wave-bg: #f5f5f5;
      --wave-text: #141414;
      --wave-border: #dc2626;
      
      --plate-bg: #ffffff;
      --plate-text: #141414;
      --plate-border: #d0d0d0;
      
      --race-tab-active-bg: #ffffff;
      --race-tab-active-border: #dc2626;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.4;
      transition: background-color 0.15s ease, color 0.15s ease;
      padding-bottom: 50px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .site-header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .site-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #dc2626, #ef4444, #dc2626);
    }

    .header-container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 12px 14px 0 14px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-logo {
      width: 46px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: 'Teko', sans-serif;
      font-size: 26px;
      line-height: 0.95;
      letter-spacing: 0.8px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .brand-text h1 span {
      color: var(--accent-red);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      min-height: 30px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .live-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      min-height: 30px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .live-status-badge.offline {
      background: rgba(245, 158, 11, 0.12);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
      animation: pulse 1.6s infinite;
    }

    .pulse-dot.offline {
      background-color: #f59e0b;
      animation: none;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Season Race Switcher Tabs (Ultra-Compact Mobile Swipe) */
    .race-switcher-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .race-switcher-bar::-webkit-scrollbar { display: none; }

    .race-tab-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      min-height: 44px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
      text-align: left;
    }

    .race-tab-btn.active {
      background: var(--race-tab-active-bg);
      border-color: var(--race-tab-active-border);
      border-top: 2px solid var(--race-tab-active-border);
      color: var(--text-main);
    }

    .tab-mini-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tab-text-col {
      display: flex;
      flex-direction: column;
    }

    .race-tab-date {
      font-size: 9px;
      font-weight: 700;
      color: var(--accent-red);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .race-tab-title {
      font-size: 12px;
      font-weight: 700;
    }

    /* Sub Tabs (Start Lists / Live Results / Event Details) */
    .sub-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 6px 0 8px 0;
    }

    .nav-tabs {
      display: flex;
      gap: 16px;
    }

    .nav-tab {
      padding: 6px 2px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .nav-tab:hover {
      color: var(--text-main);
    }

    .nav-tab.active {
      color: var(--accent-red);
    }

    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent-red);
    }

    .current-race-badge {
      display: none;
    }

    /* Event Location & Maps Links */
    .event-location-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .event-location-box .location-venue {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-location-box .location-address {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    .event-warning-banner {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--accent-red);
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
      color: #ff8080;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    :root[data-theme="light"] .event-warning-banner {
      background: #fef2f2;
      border-color: #ef4444;
      color: #b91c1c;
    }

    .btn-maps {
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 36px;
    }

    .btn-google-maps {
      background: #1a73e8;
      border: 1px solid #1a73e8;
      color: #ffffff !important;
    }

    .btn-google-maps:hover {
      background: #1557b0;
      border-color: #1557b0;
      transform: translateY(-1px);
    }

    .btn-apple-maps {
      background: #242424;
      border: 1px solid #3d3d3d;
      color: #ffffff !important;
    }

    .btn-apple-maps:hover {
      background: #333333;
      border-color: #555555;
      transform: translateY(-1px);
    }

    .btn-league-page {
      background: #1c1c1c;
      border: 1px solid #383838;
      color: #f0f0f0 !important;
    }

    .btn-league-page:hover {
      background: #282828;
      border-color: var(--accent-red);
      color: var(--accent-red) !important;
      transform: translateY(-1px);
    }

    :root[data-theme="light"] .btn-apple-maps {
      background: #e8e8e8;
      border-color: #cccccc;
      color: #141414 !important;
    }

    :root[data-theme="light"] .btn-apple-maps:hover {
      background: #d8d8d8;
    }

    :root[data-theme="light"] .btn-league-page {
      background: #f4f4f4;
      border-color: #d0d0d0;
      color: #141414 !important;
    }

    :root[data-theme="light"] .btn-league-page:hover {
      background: #e8e8e8;
      border-color: var(--accent-red);
      color: var(--accent-red) !important;
    }

    /* Main Container */
    .main-container {
      max-width: 1220px;
      margin: 10px auto 0 auto;
      padding: 0 10px;
    }

    /* Ultra-Compact Sticky Search & Filter Toolbar */
    .compact-toolbar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .toolbar-main-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 28px 7px 10px;
      font-size: 13px;
      outline: none;
      background: var(--bg-subtle);
      color: var(--text-main);
      min-height: 34px;
    }

    .search-input:focus {
      border-color: var(--accent-red);
    }

    .search-clear-btn {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 10px;
      min-height: 34px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      white-space: nowrap;
      flex-shrink: 0;
      text-decoration: none;
    }

    .btn-icon:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
    }

    .btn-icon.active-filter {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* Collapsible Filter Panel */
    .collapsible-filters {
      display: none;
      padding-top: 10px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
      gap: 8px;
      flex-direction: column;
    }

    .collapsible-filters.show {
      display: flex;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @media (min-width: 768px) {
      .filters-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .collapsible-filters {
        display: flex !important;
      }
      .toggle-filter-btn {
        display: none;
      }
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .filter-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.4px;
    }

    .select-dropdown {
      padding: 6px 10px;
      min-height: 34px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: var(--bg-subtle);
      color: var(--text-main);
      outline: none;
      width: 100%;
      cursor: pointer;
    }

    .select-dropdown:focus {
      border-color: var(--accent-red);
    }

    /* Active Filter Summary Bar */
    .filter-summary-chips {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filter-summary-chips::-webkit-scrollbar { display: none; }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .filter-chip strong {
      color: var(--text-main);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .stat-bold {
      color: var(--text-main);
      font-weight: 700;
    }

    /* Table Cards & Clean Black/Gray Wave Dividers */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }

    .category-header {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      padding: 9px 12px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      border-left: 3px solid var(--accent-red);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .category-header:hover {
      background: var(--bg-card-hover);
    }

    .collapsible-header {
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .collapsible-header:hover {
      background: var(--bg-card-hover) !important;
    }

    .card-toggle-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.15s ease, color 0.15s ease;
      cursor: pointer;
      margin-left: 6px;
      flex-shrink: 0;
    }

    .category-header:hover .card-toggle-icon,
    .collapsible-header:hover .card-toggle-icon {
      color: var(--text-main);
      border-color: var(--border-strong);
    }

    .card-toggle-icon.collapsed,
    .collapsed .card-toggle-icon {
      transform: rotate(-90deg);
    }

    .collapsible-body {
      transition: opacity 0.2s ease;
    }

    .collapsible-body.collapsed {
      display: none !important;
    }

    .category-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 10px;
    }

    .wave-divider {
      background: var(--wave-bg);
      color: var(--wave-text);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border-left: 3px solid var(--wave-border);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Responsive Table Container */
    .table-responsive-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
      min-width: 520px;
    }

    .results-table th {
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .results-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      white-space: nowrap;
    }

    .results-table tr:last-child td {
      border-bottom: none;
    }

    .results-table tr:hover td {
      background-color: var(--bg-card-hover);
    }

    .plate-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 6px;
      background: var(--plate-bg);
      color: var(--plate-text);
      border: 1px solid var(--plate-border);
      border-radius: 4px;
      min-width: 40px;
    }

    .rider-name {
      font-weight: 600;
      color: var(--text-main);
    }

    .team-name {
      color: var(--text-muted);
    }

    .team-name-lax {
      color: var(--text-main);
      font-weight: 600;
    }

    .div-tag {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--bg-subtle);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .no-results {
      padding: 30px 16px;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .upcoming-race-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px 16px;
      text-align: center;
      box-shadow: var(--shadow-card);
      margin-bottom: 20px;
    }

    .upcoming-logo-hero {
      max-width: 200px;
      max-height: 110px;
      object-fit: contain;
      margin: 0 auto 12px auto;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
    }

    .notice-box {
      background: var(--accent-red-subtle);
      border: 1px solid rgba(220, 38, 38, 0.25);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--accent-red);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Event Details View Styling */
    .event-details-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    .event-details-hero {
      padding: 20px 16px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .event-hero-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .event-hero-meta h2 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
    }

    .event-hero-meta p {
      font-size: 13px;
      color: var(--text-muted);

    async function fetchLiveRaceresultData() {
      if (currentTab === 'details') return;
      const race = SEASON_RACES[currentRaceIndex];
      if (!race.isPublished || !race.eventId) return;

      const selectedListId = document.getElementById('listSelect').value;
      currentListMode = (selectedListId === '747B52' || selectedListId === 'E07F7C') ? 'TEAM' : 'WAVE';
      const cacheKey = `laxmtb_cache_${race.id}_${currentTab}_${selectedListId}`;

      if (!navigator.onLine) {
        loadFromLocalStorage(cacheKey);
        return;
      }

      try {
        const configResp = await fetch(`https://my.raceresult.com/${race.eventId}/${currentTab}/config?lang=en`);
        if (!configResp.ok) throw new Error(`Config HTTP ${configResp.status}`);
        const config = await configResp.json();
        const key = config.key;

        const lists = config?.TabConfig?.Lists || [];
        const targetList = lists.find(l => l.ID === selectedListId) || lists[0];
        const listName = targetList ? targetList.Name : '';

        const params = new URLSearchParams({
          key: key,
          listname: listName,
          page: currentTab,
          contest: '0',
          r: 'all',
          l: '0'
        });

        const listResp = await fetch(`https://my.raceresult.com/${race.eventId}/${currentTab}/list?` + params.toString());
        if (!listResp.ok) throw new Error(`List HTTP ${listResp.status}`);
        const resultData = await listResp.json();

        parseUniversalData(resultData, targetList, cacheKey);

        setOnlineBadge(true);
        document.getElementById('lastUpdatedText').textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (err) {
        console.warn('[LAXMTB] Live fetch error, restoring cached data:', err);
        loadFromLocalStorage(cacheKey);
      }
    }

    function loadFromLocalStorage(cacheKey) {
      if (currentTab === 'details') return;
      setOnlineBadge(false);
      try {
        const cachedStr = localStorage.getItem(cacheKey);
        if (cachedStr) {
          const cached = JSON.parse(cachedStr);
          currentRiders = cached.riders || [];
          document.getElementById('lastUpdatedText').textContent = '📶 Offline (' + (cached.time || 'Saved') + ')';
          populateFilterDropdowns();
          renderData();
          return;
        }
      } catch (e) {}

      if (currentTab === 'list') {
        currentRiders = fallbackSnapshot;
        document.getElementById('lastUpdatedText').textContent = '📶 Offline Snapshot';
        populateFilterDropdowns();
        renderData();
      } else {
        renderNoResultsNotice('Live race results will stream automatically on race day.');
      }
    }

    function parseUniversalData(resultData, listInfo, cacheKey) {
      if (currentTab === 'details') return;
      const rawData = resultData?.data;
      const listId = listInfo?.ID || document.getElementById('listSelect').value;

      if (Array.isArray(rawData) && rawData.length === 0 && currentTab === 'results') {
        renderNoResultsNotice('No race finishes recorded yet. Results stream live on race day.');
        currentRiders = [];
        return;
      }

      document.getElementById('noticeContainer').innerHTML = '';
      const extracted = [];

      function traverse(node, context) {
        if (node && typeof node === 'object' && !Array.isArray(node)) {
          for (const [key, val] of Object.entries(node)) {
            const cleanKey = key.includes('_') ? key.split('_').slice(1).join('_') : key;
            const newCtx = { ...context };

            if (cleanKey.includes('Wave')) {
              newCtx.wave = cleanKey;
            } else if (categoryOrder.some(c => cleanKey.includes(c)) || cleanKey.includes('Boys') || cleanKey.includes('Girls') || cleanKey.includes('Open')) {
              newCtx.category = cleanKey;
            } else if (cleanKey.includes('School') || cleanKey.includes('Composite') || cleanKey.includes('Team') || cleanKey.includes('Cycling') || cleanKey.includes('Spooner')) {
              newCtx.team = cleanKey.replace(/\s*\(Division\s*\d+\)/i, '').trim();
            }
            traverse(val, newCtx);
          }
        } else if (Array.isArray(node)) {
          node.forEach(row => {
            if (Array.isArray(row) && row.length >= 4) {
              let rider = { ...context };

              if (listId === '747B52') {
                rider.bib = row[1] || '';
                rider.no = row[1] || '';
                rider.name = row[2] || '';
                rider.gender = row[3] || '';
                rider.category = row[4] || rider.category || '';
                rider.wave = rider.wave || 'Wave: 1';
                rider.div = rider.team && rider.team.includes('Division 1') ? '1' : '2';
                rider.wv = '1';
                rider.wv_rank = '1';
                rider.return_val = '+';
              } else {
                rider.no = row[0] || '';
                rider.bib = row[1] || '';
                rider.pl = row[2] || '';
                rider.name = row[3] || '';
                rider.team = row[4] || rider.team || '';
                rider.div = row[5] || '1';
                rider.wv = row[6] || '1';
                rider.wv_rank = row[2] || '';
                rider.return_val = row[7] || '+';
              }

              if (rider.name && rider.team) {
                extracted.push(rider);
              }
            } else if (typeof row === 'object') {
              traverse(row, context);
            }
          });
        }
      }

      traverse(rawData, {});

      currentRiders = extracted.length > 0 ? extracted : fallbackSnapshot;
      
      if (extracted.length > 0 && cacheKey) {
        try {
          localStorage.setItem(cacheKey, JSON.stringify({
            time: new Date().toLocaleTimeString(),
            riders: extracted
          }));
        } catch(e) {}
      }

      populateFilterDropdowns();
      updateFilterSummaryChips();
      renderData();
    }

    function renderNoResultsNotice(msg) {
      if (currentTab === 'details') return;
      document.getElementById('noticeContainer').innerHTML = `
        <div class="notice-box">
          <span style="font-size:14px;">ℹ️</span>
          <span>${msg}</span>
        </div>
      `;
      document.getElementById('tablesContainer').innerHTML = `
        <div class="no-results">
          <h3 style="font-size:15px;font-weight:700;">No Results Recorded Yet</h3>
          <p style="margin-top:4px;color:var(--text-muted);font-size:12px;">Switch to <strong>Start Lists</strong> to view wave placements and rider plate numbers.</p>
        </div>
      `;
      document.getElementById('statusCount').textContent = '0 results recorded';
    }

    function populateFilterDropdowns() {
      const catSelect = document.getElementById('categoryFilter');
      const prevCat = catSelect.value;
      const categories = [...new Set(currentRiders.map(r => r.category).filter(Boolean))].sort((a, b) => {
        let ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      catSelect.innerHTML = '<option value="ALL">&lt;All Categories&gt;</option>';
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        catSelect.appendChild(opt);
      });
      if (categories.includes(prevCat)) catSelect.value = prevCat;

      const teamSelect = document.getElementById('teamFilter');
      const prevTeam = teamSelect.value;
      const teams = [...new Set(currentRiders.map(r => r.team).filter(Boolean))].sort();

      teamSelect.innerHTML = `
        <option value="DEFAULT_TEAMS">All LAX Area Teams (La Crosse, Holmen, La Crescent)</option>
        <option value="ALL">&lt;Show All ${teams.length} Event Teams&gt;</option>
      `;
      teams.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        teamSelect.appendChild(opt);
      });
      if (prevTeam && (prevTeam === 'DEFAULT_TEAMS' || prevTeam === 'ALL' || teams.includes(prevTeam))) {
        teamSelect.value = prevTeam;
      }
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      renderData();
    }

    function renderData() {
      if (currentTab === 'details') return;
      if (currentRiders.length === 0) return;

      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCat = document.getElementById('categoryFilter').value;
      const selectedTeam = document.getElementById('teamFilter').value;

      const filtered = currentRiders.filter(r => {
        if (selectedCat !== 'ALL' && r.category !== selectedCat) return false;

        if (selectedTeam === 'DEFAULT_TEAMS') {
          const isTarget = targetTeamKeywords.some(kw => r.team && r.team.toLowerCase().includes(kw));
          if (!isTarget) return false;
        } else if (selectedTeam !== 'ALL') {
          if (r.team !== selectedTeam) return false;
        }

        if (query) {
          const match = (r.name && r.name.toLowerCase().includes(query)) ||
                        (r.no && r.no.toLowerCase().includes(query)) ||
                        (r.bib && r.bib.toLowerCase().includes(query)) ||
                        (r.team && r.team.toLowerCase().includes(query)) ||
                        (r.category && r.category.toLowerCase().includes(query)) ||
                        (r.wave && r.wave.toLowerCase().includes(query));
          if (!match) return false;
        }
        return true;
      });

      document.getElementById('statusCount').innerHTML = `Showing <span class="stat-bold">${filtered.length}</span> of <span class="stat-bold">${currentRiders.length}</span> riders`;

      const container = document.getElementById('tablesContainer');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">No riders matched your current search / filter.</div>';
        return;
      }

      if (currentListMode === 'TEAM') {
        renderGroupedByTeam(filtered, container);
      } else {
        renderGroupedByCategoryWave(filtered, container);
      }
    }

    function renderGroupedByCategoryWave(riders, container) {
      const grouped = {};
      riders.forEach(r => {
        const cat = r.category || 'General';
        const wave = r.wave || 'Wave: 1';
        if (!grouped[cat]) grouped[cat] = {};
        if (!grouped[cat][wave]) grouped[cat][wave] = [];
        grouped[cat][wave].push(r);
      });

      const sortedCatKeys = Object.keys(grouped).sort((a, b) => {
        let ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      sortedCatKeys.forEach(cat => {
        const catCard = document.createElement('div');
        catCard.className = 'table-card';

        const totalInCat = Object.values(grouped[cat]).reduce((acc, list) => acc + list.length, 0);

        const catTitle = document.createElement('div');
        catTitle.className = 'category-header collapsible-header';
        catTitle.onclick = function() { toggleCard(this); };
        catTitle.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;">
            <span>${cat}</span>
            <span class="category-badge">${totalInCat} RIDERS</span>
          </div>
          <span class="card-toggle-icon" title="Toggle ${cat}">▼</span>
        `;
        catCard.appendChild(catTitle);

        const cardBody = document.createElement('div');
        cardBody.className = 'collapsible-body';

        const waves = grouped[cat];
        const sortedWaveKeys = Object.keys(waves).sort();

        sortedWaveKeys.forEach(wKey => {
          const waveHeader = document.createElement('div');
          waveHeader.className = 'wave-divider';
          waveHeader.innerHTML = `<span>🚩</span> ${wKey.includes('Wave') ? wKey : `Wave: ${wKey}`}`;
          cardBody.appendChild(waveHeader);

          const tableWrapper = document.createElement('div');
          tableWrapper.className = 'table-responsive-wrapper';

          const table = document.createElement('table');
          table.className = 'results-table';
          table.innerHTML = `
            <thead>
              <tr>
                <th style="width:40px;">PL</th>
                <th style="width:70px;">Plate #</th>
                <th>Rider Name</th>
                <th>Team / School</th>
                <th style="text-align:center;width:50px;">Div</th>
                <th style="text-align:center;width:50px;">Wave</th>
                <th style="text-align:center;width:50px;">Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          `;

          const tbody = table.querySelector('tbody');
          const ridersInWave = waves[wKey].sort((a, b) => {
            const pa = parseInt(a.pl) || parseInt(a.bib) || 0;
            const pb = parseInt(b.pl) || parseInt(b.bib) || 0;
            return pa - pb;
          });

          ridersInWave.forEach(r => {
            const isTarget = targetTeamKeywords.some(kw => r.team && r.team.toLowerCase().includes(kw));
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td style="color:var(--text-muted);font-weight:600;">${r.pl || '-'}</td>
              <td><span class="plate-number">#${r.no || r.bib}</span></td>
              <td><span class="rider-name">${r.name}</span></td>
              <td><span class="${isTarget ? 'team-name-lax' : 'team-name'}">${r.team}</span></td>
              <td style="text-align:center;"><span class="div-tag">D${r.div || '1'}</span></td>
              <td style="text-align:center;color:var(--text-muted);">${r.wv || '1'}</td>
              <td style="text-align:center;font-weight:700;color:var(--accent-red);">${r.return_val || '+'}</td>
            `;
            tbody.appendChild(tr);
          });

          tableWrapper.appendChild(table);
          cardBody.appendChild(tableWrapper);
        });

        catCard.appendChild(cardBody);
        container.appendChild(catCard);
      });
    }

    function renderGroupedByTeam(riders, container) {
      const grouped = {};
      riders.forEach(r => {
        const team = r.team || 'Independent';
        if (!grouped[team]) grouped[team] = [];
        grouped[team].push(r);
      });

      const sortedTeams = Object.keys(grouped).sort();

      sortedTeams.forEach(team => {
        const teamCard = document.createElement('div');
        teamCard.className = 'table-card';

        const teamHeader = document.createElement('div');
        teamHeader.className = 'category-header collapsible-header';
        teamHeader.onclick = function() { toggleCard(this); };
        teamHeader.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;">
            <span>${team}</span>
            <span class="category-badge">${grouped[team].length} RIDERS</span>
          </div>
          <span class="card-toggle-icon" title="Toggle ${team}">▼</span>
        `;
        teamCard.appendChild(teamHeader);

        const cardBody = document.createElement('div');
        cardBody.className = 'collapsible-body';

        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'table-responsive-wrapper';

        const table = document.createElement('table');
        table.className = 'results-table';
        table.innerHTML = `
          <thead>
            <tr>
              <th style="width:70px;">Plate #</th>
              <th>Rider Name</th>
              <th>Category</th>
              <th style="text-align:center;width:50px;">Div</th>
              <th style="text-align:center;width:70px;">Wave</th>
              <th style="text-align:center;width:50px;">Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;

        const tbody = table.querySelector('tbody');
        const teamRiders = grouped[team].sort((a, b) => {
          let ia = categoryOrder.indexOf(a.category), ib = categoryOrder.indexOf(b.category);
          if (ia === -1) ia = 99;
          if (ib === -1) ib = 99;
          if (ia !== ib) return ia - ib;
          return (a.name || '').localeCompare(b.name || '');
        });

        teamRiders.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="plate-number">#${r.bib || r.no}</span></td>
            <td><span class="rider-name">${r.name}</span></td>
            <td><strong style="color:var(--text-main);">${r.category || ''}</strong></td>
            <td style="text-align:center;"><span class="div-tag">D${r.div || '1'}</span></td>
            <td style="text-align:center;color:var(--text-muted);">${r.wave || 'Wave 1'}</td>
            <td style="text-align:center;font-weight:700;color:var(--accent-red);">${r.return_val || '+'}</td>
          `;
          tbody.appendChild(tr);
        });

        tableWrapper.appendChild(table);
        cardBody.appendChild(tableWrapper);
        teamCard.appendChild(cardBody);
        container.appendChild(teamCard);
      });
    }

    let allCardsCollapsed = false;

    function toggleCard(headerEl) {
      const card = headerEl.closest('.table-card, .signup-hub-section, .event-map-container, .detail-section, .event-details-card');
      if (!card) return;
      const body = card.querySelector('.collapsible-body');
      const toggleIcon = headerEl.querySelector('.card-toggle-icon');
      if (body) {
        const isCollapsed = body.classList.toggle('collapsed');
        if (toggleIcon) {
          toggleIcon.classList.toggle('collapsed', isCollapsed);
        }
      }
    }

    function toggleAllCardsState() {
      allCardsCollapsed = !allCardsCollapsed;
      const bodies = document.querySelectorAll('.collapsible-body');
      const icons = document.querySelectorAll('.card-toggle-icon');
      
      bodies.forEach(b => {
        if (allCardsCollapsed) {
          b.classList.add('collapsed');
        } else {
          b.classList.remove('collapsed');
        }
      });

      icons.forEach(i => {
        if (allCardsCollapsed) {
          i.classList.add('collapsed');
        } else {
          i.classList.remove('collapsed');
        }
      });

      const label = document.getElementById('toggleAllCardsLabel');
      if (label) {
        label.textContent = allCardsCollapsed ? 'Expand All' : 'Collapse All';
      }
    }

    function setupAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      const intervalSec = parseInt(document.getElementById('autoRefreshInterval').value, 10);
      if (intervalSec > 0) {
        autoRefreshTimer = setInterval(fetchLiveRaceresultData, intervalSec * 1000);
      }
    }

    initTheme();
    renderRaceSwitcher();
    selectRace(0);
    setupAutoRefresh();
  </script>
</body>
</html>
