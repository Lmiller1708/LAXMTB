<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>LAX MTB | Race Central (2026 Season)</title>
  
  <!-- App Icons -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAX MTB">
  <meta name="theme-color" content="#0d0d0d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Strict Pure Black & Neutral Gray Palette (Zero Brown/Warm Tints) */
    :root[data-theme="dark"] {
      --bg-body: #0d0d0d;
      --bg-header: #141414;
      --bg-card: #181818;
      --bg-card-hover: #222222;
      --bg-subtle: #202020;
      --border: #2c2c2c;
      --border-strong: #3f3f3f;
      --text-main: #f5f5f5;
      --text-muted: #9e9e9e;
      --text-dim: #707070;
      
      --accent-red: #ef4444;
      --accent-red-hover: #dc2626;
      --accent-red-subtle: rgba(239, 68, 68, 0.12);
      
      --wave-bg: #1c1c1c;
      --wave-text: #f5f5f5;
      --wave-border: #ef4444;
      
      --plate-bg: #242424;
      --plate-text: #ffffff;
      --plate-border: #3d3d3d;
      
      --race-tab-active-bg: #222222;
      --race-tab-active-border: #ef4444;
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    :root[data-theme="light"] {
      --bg-body: #f4f4f4;
      --bg-header: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f9f9f9;
      --bg-subtle: #efefef;
      --border: #dedede;
      --border-strong: #cccccc;
      --text-main: #141414;
      --text-muted: #666666;
      --text-dim: #888888;
      
      --accent-red: #dc2626;
      --accent-red-hover: #b91c1c;
      --accent-red-subtle: rgba(220, 38, 38, 0.08);
      
      --wave-bg: #f5f5f5;
      --wave-text: #141414;
      --wave-border: #dc2626;
      
      --plate-bg: #ffffff;
      --plate-text: #141414;
      --plate-border: #d0d0d0;
      
      --race-tab-active-bg: #ffffff;
      --race-tab-active-border: #dc2626;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.45;
      transition: background-color 0.15s ease, color 0.15s ease;
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .site-header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .site-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #dc2626, #ef4444, #dc2626);
    }

    .header-container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 16px 16px 0 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .team-logo {
      width: 64px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: 'Teko', sans-serif;
      font-size: 30px;
      line-height: 0.95;
      letter-spacing: 0.8px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .brand-text h1 span {
      color: var(--accent-red);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      min-height: 36px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }

    .live-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      min-height: 36px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Season Race Switcher Tabs (5 Races with Mini-Logos) */
    .race-switcher-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: thin;
    }

    .race-tab-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      min-height: 52px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
      text-align: left;
    }

    .race-tab-btn:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
      color: var(--text-main);
    }

    .race-tab-btn.active {
      background: var(--race-tab-active-bg);
      border-color: var(--race-tab-active-border);
      border-top: 3px solid var(--race-tab-active-border);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .tab-mini-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px;
      flex-shrink: 0;
    }

    .tab-text-col {
      display: flex;
      flex-direction: column;
    }

    .race-tab-date {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-red);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .race-tab-title {
      font-size: 12px;
      font-weight: 700;
      margin-top: 1px;
    }

    .race-tab-location {
      font-size: 10px;
      color: var(--text-dim);
    }

    /* Sub Tabs (Start Lists / Live Results) */
    .sub-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 8px;
    }

    .nav-tabs {
      display: flex;
      gap: 20px;
    }

    .nav-tab {
      padding: 8px 2px 10px 2px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-tab:hover {
      color: var(--text-main);
    }

    .nav-tab.active {
      color: var(--accent-red);
    }

    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent-red);
      border-radius: 3px 3px 0 0;
    }

    .current-race-badge {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Main Container */
    .main-container {
      max-width: 1220px;
      margin: 16px auto 0 auto;
      padding: 0 12px;
    }

    /* Controls Panel */
    .controls-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
    }

    .top-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .actions-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      min-height: 38px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      border-color: var(--border-strong);
      background: var(--bg-card-hover);
    }

    .btn-primary {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-red-hover);
      border-color: var(--accent-red-hover);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-grow: 1;
      max-width: 320px;
    }

    .search-input {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      min-height: 38px;
      font-size: 13px;
      width: 100%;
      outline: none;
      background: var(--bg-subtle);
      color: var(--text-main);
    }

    .search-input:focus {
      border-color: var(--accent-red);
    }

    .filters-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .select-dropdown {
      padding: 8px 12px;
      min-height: 38px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: var(--bg-subtle);
      color: var(--text-main);
      outline: none;
      flex: 1 1 180px;
      cursor: pointer;
    }

    .select-dropdown:focus {
      border-color: var(--accent-red);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .stat-bold {
      color: var(--text-main);
      font-weight: 700;
    }

    /* Table Cards & Clean Black/Gray Wave Dividers */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: var(--shadow-card);
    }

    .category-header {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      padding: 10px 14px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      border-left: 4px solid var(--accent-red);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 12px;
      letter-spacing: 0.3px;
    }

    .wave-divider {
      background: var(--wave-bg);
      color: var(--wave-text);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 7px 14px;
      border-left: 3px solid var(--wave-border);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Responsive Table Container */
    .table-responsive-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
      min-width: 580px;
    }

    .results-table th {
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .results-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      white-space: nowrap;
    }

    .results-table tr:last-child td {
      border-bottom: none;
    }

    .results-table tr:hover td {
      background-color: var(--bg-card-hover);
    }

    .plate-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      padding: 3px 8px;
      background: var(--plate-bg);
      color: var(--plate-text);
      border: 1px solid var(--plate-border);
      border-radius: 4px;
      letter-spacing: 0.3px;
      min-width: 44px;
    }

    .rider-name {
      font-weight: 600;
      color: var(--text-main);
    }

    .team-name {
      color: var(--text-muted);
    }

    .team-name-lax {
      color: var(--text-main);
      font-weight: 600;
    }

    .div-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--bg-subtle);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .no-results {
      padding: 40px 16px;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    /* Prominent Official Upcoming Race Card with Extracted Logo */
    .upcoming-race-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 36px 20px;
      text-align: center;
      box-shadow: var(--shadow-card);
      margin-bottom: 24px;
    }

    .upcoming-logo-hero {
      max-width: 220px;
      max-height: 100px;
      object-fit: contain;
      margin: 0 auto 16px auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }

    .notice-box {
      background: var(--accent-red-subtle);
      border: 1px solid rgba(220, 38, 38, 0.25);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--accent-red);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-controls {
        width: 100%;
        justify-content: space-between;
      }
      .search-box {
        max-width: 100%;
      }
      .actions-left {
        width: 100%;
      }
      .filters-row {
        flex-direction: column;
      }
      .select-dropdown {
        width: 100%;
      }
    }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      .controls-panel, .site-header, .race-switcher-bar { box-shadow: none; }
      .theme-toggle-btn { display: none; }
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-container">
      <div class="header-top">
        
        <div class="brand-box">
          <img src="logo.png" alt="La Crosse Area MTB Team" class="team-logo" onerror="this.style.display='none'">
          <div class="brand-text">
            <h1>LAX MTB <span>// RACE CENTRAL</span></h1>
          </div>
        </div>

        <div class="header-controls">
          <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
            <span id="themeIcon">☀️</span> <span id="themeLabel">Light</span>
          </button>
          <span class="live-status-badge">
            <span class="pulse-dot" id="liveDot"></span>
            <span id="liveStatusText">Live API</span>
          </span>
        </div>

      </div>

      <!-- 5-Race Season Switcher Tabs with Mini Logos -->
      <div class="race-switcher-bar" id="raceSwitcherBar">
        <!-- Rendered by JS -->
      </div>

      <!-- Sub Navigation Row -->
      <div class="sub-nav-row">
        <nav class="nav-tabs">
          <div class="nav-tab active" id="tabStartLists" onclick="switchTab('list')">
            <span>🏁</span> Start Lists
          </div>
          <div class="nav-tab inactive" id="tabLiveResults" onclick="switchTab('results')">
            <span>⏱️</span> Live Results
          </div>
        </nav>

        <div class="current-race-badge" id="currentRaceMeta">
          <!-- Rendered by JS -->
        </div>
      </div>

    </div>
  </header>

  <!-- Main Content -->
  <main class="main-container">

    <div id="noticeContainer"></div>
    
    <!-- Controls Panel -->
    <div class="controls-panel" id="controlsPanel">
      <div class="top-toolbar">
        <div class="actions-left">
          <button class="btn btn-primary" onclick="fetchLiveRaceresultData()">
            <span id="refreshIcon">🔄</span> Refresh
          </button>
          <button class="btn" onclick="window.print()">
            <span>📄</span> Print / PDF
          </button>
          <div style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;">
            <span>Auto:</span>
            <select id="autoRefreshInterval" class="select-dropdown" style="min-width:90px;min-height:36px;padding:4px 8px;flex:none;" onchange="setupAutoRefresh()">
              <option value="0">Off</option>
              <option value="15">15s</option>
              <option value="30" selected>30s</option>
              <option value="60">60s</option>
            </select>
          </div>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="Search rider, plate #, team..." oninput="renderData()">
          <button class="btn" onclick="clearSearch()">✕</button>
        </div>
      </div>

      <div class="filters-row">
        <!-- List View Dropdown -->
        <select id="listSelect" class="select-dropdown" onchange="onListDropdownChange()">
          <option value="22E0EB">Rider List - By Category & Wave</option>
          <option value="747B52">Rider List - By Team</option>
        </select>

        <!-- Category Dropdown -->
        <select id="categoryFilter" class="select-dropdown" onchange="renderData()">
          <option value="ALL">&lt;All Categories&gt;</option>
        </select>

        <!-- Team Dropdown -->
        <select id="teamFilter" class="select-dropdown" onchange="renderData()">
          <option value="DEFAULT_TEAMS">All LAX Area Teams (La Crosse, Holmen, La Crescent)</option>
          <option value="ALL">&lt;Show All 44 Event Teams&gt;</option>
        </select>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
      <span id="statusCount">Loading data...</span>
      <span id="lastUpdatedText">Connecting to RACE RESULT...</span>
    </div>

    <!-- Tables Container -->
    <div id="tablesContainer">
      <div class="no-results">Connecting to RACE RESULT Live API...</div>
    </div>

  </main>

  <script>
    // 5 Official Season Races with Logos
    const SEASON_RACES = [
      {
        id: 'bluff-bash',
        name: 'Bluff Bash Festival',
        dateStr: '04 - 07 Sept 2026',
        venue: 'Powers Bluff County Park',
        city: 'Marshfield, WI',
        logo: 'logos/bluff-bash.png',
        eventId: 418104,
        isPublished: true
      },
      {
        id: 'cable-conquest',
        name: 'Cable Conquest Festival',
        dateStr: '11 - 13 Sept 2026',
        venue: 'Mt Telemark Village',
        city: 'Cable, WI',
        logo: 'logos/cable-conquest.png',
        eventId: null,
        isPublished: false
      },
      {
        id: 'hodag-hustle',
        name: 'Hodag Hustle Festival',
        dateStr: '02 - 04 Oct 2026',
        venue: 'Camp Tesomas',
        city: 'Rhinelander, WI',
        logo: 'logos/hodag-hustle.png',
        eventId: null,
        isPublished: false
      },
      {
        id: 'gnarly-nordic',
        name: 'Gnarly Nordic Festival',
        dateStr: '09 - 11 Oct 2026',
        venue: 'Nordic Mountain',
        city: 'Wild Rose, WI',
        logo: 'logos/gnarly-nordic.png',
        eventId: null,
        isPublished: false
      },
      {
        id: 'red-barn',
        name: 'Red Barn State Championship',
        dateStr: '23 - 25 Oct 2026',
        venue: 'Trek Trails',
        city: 'Waterloo, WI',
        logo: 'logos/red-barn.png',
        eventId: null,
        isPublished: false
      }
    ];

    let currentRaceIndex = 0;
    let currentTab = 'list';
    let currentRiders = [];

        btn.className = 'race-tab-btn' + (idx === currentRaceIndex ? ' active' : '');
        btn.onclick = () => selectRace(idx);
        btn.innerHTML = `
          <img src="${race.logo}" alt="${race.name}" class="tab-mini-logo" onerror="this.style.display='none'">
          <div class="tab-text-col">
            <span class="race-tab-date">Race ${idx + 1} • ${race.dateStr.split('2026')[0].trim()}</span>
            <span class="race-tab-title">${race.name}</span>
            <span class="race-tab-location">${race.city}</span>
          </div>
        `;
        bar.appendChild(btn);
      });

      const activeRace = SEASON_RACES[currentRaceIndex];
      document.getElementById('currentRaceMeta').innerHTML = `
        <span>🚵 <strong>${activeRace.name}</strong></span>
        <span>📍 ${activeRace.venue}, ${activeRace.city}</span>
      `;
    }

    function selectRace(idx) {
      currentRaceIndex = idx;
      renderRaceSwitcher();
      const race = SEASON_RACES[currentRaceIndex];

      if (!race.isPublished || !race.eventId) {
        renderUpcomingRace(race);
      } else {
        document.getElementById('controlsPanel').style.display = 'block';
        document.getElementById('statusBar').style.display = 'flex';
        fetchLiveRaceresultData();
      }
    }

    function renderUpcomingRace(race) {
      document.getElementById('controlsPanel').style.display = 'none';
      document.getElementById('statusBar').style.display = 'none';
      document.getElementById('noticeContainer').innerHTML = '';
      document.getElementById('tablesContainer').innerHTML = `
        <div class="upcoming-race-card">
          <img src="${race.logo}" alt="${race.name}" class="upcoming-logo-hero" onerror="this.style.display='none'">
          <h2 style="font-size:22px;font-weight:800;color:var(--text-main);">${race.name}</h2>
          <p style="margin-top:6px;font-size:14px;color:var(--accent-red);font-weight:700;">📅 ${race.dateStr}</p>
          <p style="margin-top:4px;font-size:13px;color:var(--text-muted);">📍 ${race.venue} • ${race.city}</p>
          <div style="margin-top:22px;padding:14px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:6px;max-width:480px;margin-left:auto;margin-right:auto;">
            <p style="font-size:13px;color:var(--text-main);">
              🏁 <strong>Start lists & wave assignments</strong> for this race will be published by the race timer during race week.
            </p>
            <p style="margin-top:6px;font-size:12px;color:var(--text-dim);">
              Live timing and lap splits will automatically connect here once published on race day.
            </p>
          </div>
        </div>
      `;
      document.getElementById('liveStatusText').textContent = 'Upcoming Race';
      document.getElementById('liveDot').style.backgroundColor = '#707070';
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('laxmtb_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeUI(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('laxmtb_theme', next);
      updateThemeUI(next);
    }

    function updateThemeUI(theme) {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        label.textContent = 'Light';
      } else {
        icon.textContent = '🌙';
        label.textContent = 'Dark';
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabStartLists').className = tab === 'list' ? 'nav-tab active' : 'nav-tab inactive';
      document.getElementById('tabLiveResults').className = tab === 'results' ? 'nav-tab active' : 'nav-tab inactive';
      
      const listDropdown = document.getElementById('listSelect');
      listDropdown.innerHTML = '';
      if (tab === 'list') {
        listDropdown.innerHTML = `
          <option value="22E0EB">Rider List - By Category & Wave</option>
          <option value="747B52">Rider List - By Team</option>
        `;
      } else {
        listDropdown.innerHTML = `
          <option value="4C8C1F">Individual Results - ALL</option>
          <option value="E07F7C">Individual Results - By Team</option>
          <option value="674D5B">Team Results</option>
        `;
      }

      const race = SEASON_RACES[currentRaceIndex];
      if (race.isPublished && race.eventId) {
        fetchLiveRaceresultData();
      }
    }

    function onListDropdownChange() {
      fetchLiveRaceresultData();
    }

    async function fetchLiveRaceresultData() {
      const race = SEASON_RACES[currentRaceIndex];
      if (!race.isPublished || !race.eventId) return;

      const selectedListId = document.getElementById('listSelect').value;
      currentListMode = (selectedListId === '747B52' || selectedListId === 'E07F7C') ? 'TEAM' : 'WAVE';

      try {
        const configResp = await fetch(`https://my.raceresult.com/${race.eventId}/${currentTab}/config?lang=en`);
        if (!configResp.ok) throw new Error(`Config HTTP ${configResp.status}`);
        const config = await configResp.json();
        const key = config.key;

        const lists = config?.TabConfig?.Lists || [];
        const targetList = lists.find(l => l.ID === selectedListId) || lists[0];
        const listName = targetList ? targetList.Name : '';

        const params = new URLSearchParams({
          key: key,
          listname: listName,
          page: currentTab,
          contest: '0',
          r: 'all',
          l: '0'
        });

        const listResp = await fetch(`https://my.raceresult.com/${race.eventId}/${currentTab}/list?` + params.toString());
        if (!listResp.ok) throw new Error(`List HTTP ${listResp.status}`);
        const resultData = await listResp.json();

        parseUniversalData(resultData, targetList);

        document.getElementById('liveDot').style.backgroundColor = '#10b981';
        document.getElementById('liveStatusText').textContent = 'Live API';
        document.getElementById('lastUpdatedText').textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (err) {
        console.warn('Live fetch error, falling back to snapshot:', err);
        document.getElementById('liveDot').style.backgroundColor = '#707070';
        document.getElementById('liveStatusText').textContent = 'Snapshot';
        document.getElementById('lastUpdatedText').textContent = 'Loaded snapshot data';
        
        if (currentTab === 'list') {
          currentRiders = fallbackSnapshot;
          populateFilterDropdowns();
          renderData();
        } else {
          renderNoResultsNotice('Live race results will stream automatically on race day.');
        }
      }
    }

    function parseUniversalData(resultData, listInfo) {
      const rawData = resultData?.data;
      const listId = listInfo?.ID || document.getElementById('listSelect').value;

      if (Array.isArray(rawData) && rawData.length === 0 && currentTab === 'results') {
        renderNoResultsNotice('No race finishes recorded yet for this event. Results and lap times will appear live on race day.');
        currentRiders = [];
        return;
      }

      document.getElementById('noticeContainer').innerHTML = '';
      const extracted = [];

      function traverse(node, context) {
        if (node && typeof node === 'object' && !Array.isArray(node)) {
          for (const [key, val] of Object.entries(node)) {
            const cleanKey = key.includes('_') ? key.split('_').slice(1).join('_') : key;
            const newCtx = { ...context };

            if (cleanKey.includes('Wave')) {
              newCtx.wave = cleanKey;
            } else if (categoryOrder.some(c => cleanKey.includes(c)) || cleanKey.includes('Boys') || cleanKey.includes('Girls') || cleanKey.includes('Open')) {
              newCtx.category = cleanKey;
            } else if (cleanKey.includes('School') || cleanKey.includes('Composite') || cleanKey.includes('Team') || cleanKey.includes('Cycling') || cleanKey.includes('Spooner')) {
              newCtx.team = cleanKey.replace(/\s*\(Division\s*\d+\)/i, '').trim();
            }
            traverse(val, newCtx);
          }
        } else if (Array.isArray(node)) {
          node.forEach(row => {
            if (Array.isArray(row) && row.length >= 4) {
              let rider = { ...context };

              if (listId === '747B52') {
                rider.bib = row[1] || '';
                rider.no = row[1] || '';
                rider.name = row[2] || '';
                rider.gender = row[3] || '';
                rider.category = row[4] || rider.category || '';
                rider.wave = rider.wave || 'Wave: 1';
                rider.div = rider.team && rider.team.includes('Division 1') ? '1' : '2';
                rider.wv = '1';
                rider.wv_rank = '1';
                rider.return_val = '+';
              } else {
                rider.no = row[0] || '';
                rider.bib = row[1] || '';
                rider.pl = row[2] || '';
                rider.name = row[3] || '';
                rider.team = row[4] || rider.team || '';
                rider.div = row[5] || '1';
                rider.wv = row[6] || '1';
                rider.wv_rank = row[2] || '';
                rider.return_val = row[7] || '+';
              }

              if (rider.name && rider.team) {
                extracted.push(rider);
              }
            } else if (typeof row === 'object') {
              traverse(row, context);
            }
          });
        }
      }

      traverse(rawData, {});

      currentRiders = extracted.length > 0 ? extracted : fallbackSnapshot;
      populateFilterDropdowns();
      renderData();
    }

    function renderNoResultsNotice(msg) {
      document.getElementById('noticeContainer').innerHTML = `
        <div class="notice-box">
          <span style="font-size:16px;">ℹ️</span>
          <span>${msg}</span>
        </div>
      `;
      document.getElementById('tablesContainer').innerHTML = `
        <div class="no-results">
          <h3 style="font-size:16px;font-weight:700;">No Results Recorded Yet</h3>
          <p style="margin-top:6px;color:var(--text-muted);">The race has not started yet. Switch to <strong>Start Lists</strong> to view wave placements and rider plate numbers.</p>
        </div>
      `;
      document.getElementById('statusCount').textContent = '0 results recorded';
    }

    function populateFilterDropdowns() {
      const catSelect = document.getElementById('categoryFilter');
      const prevCat = catSelect.value;
      const categories = [...new Set(currentRiders.map(r => r.category).filter(Boolean))].sort((a, b) => {
        let ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      catSelect.innerHTML = '<option value="ALL">&lt;All Categories&gt;</option>';
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        catSelect.appendChild(opt);
      });
      if (categories.includes(prevCat)) catSelect.value = prevCat;

      const teamSelect = document.getElementById('teamFilter');
      const prevTeam = teamSelect.value;
      const teams = [...new Set(currentRiders.map(r => r.team).filter(Boolean))].sort();

      teamSelect.innerHTML = `
        <option value="DEFAULT_TEAMS">All LAX Area Teams (La Crosse, Holmen, La Crescent)</option>
        <option value="ALL">&lt;Show All ${teams.length} Event Teams&gt;</option>
      `;
      teams.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        teamSelect.appendChild(opt);
      });
      if (prevTeam && (prevTeam === 'DEFAULT_TEAMS' || prevTeam === 'ALL' || teams.includes(prevTeam))) {
        teamSelect.value = prevTeam;
      }
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      renderData();
    }

    function renderData() {
      if (currentRiders.length === 0) return;

      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCat = document.getElementById('categoryFilter').value;
      const selectedTeam = document.getElementById('teamFilter').value;

      const filtered = currentRiders.filter(r => {
        if (selectedCat !== 'ALL' && r.category !== selectedCat) return false;

        if (selectedTeam === 'DEFAULT_TEAMS') {
          const isTarget = targetTeamKeywords.some(kw => r.team && r.team.toLowerCase().includes(kw));
          if (!isTarget) return false;
        } else if (selectedTeam !== 'ALL') {
          if (r.team !== selectedTeam) return false;
        }

        if (query) {
          const match = (r.name && r.name.toLowerCase().includes(query)) ||
                        (r.no && r.no.toLowerCase().includes(query)) ||
                        (r.bib && r.bib.toLowerCase().includes(query)) ||
                        (r.team && r.team.toLowerCase().includes(query)) ||
                        (r.category && r.category.toLowerCase().includes(query)) ||
                        (r.wave && r.wave.toLowerCase().includes(query));
          if (!match) return false;
        }
        return true;
      });

      document.getElementById('statusCount').innerHTML = `Showing <span class="stat-bold">${filtered.length}</span> of <span class="stat-bold">${currentRiders.length}</span> riders`;

      const container = document.getElementById('tablesContainer');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">No riders matched your current search / filter.</div>';
        return;
      }

      if (currentListMode === 'TEAM') {
        renderGroupedByTeam(filtered, container);
      } else {
        renderGroupedByCategoryWave(filtered, container);
      }
    }

    function renderGroupedByCategoryWave(riders, container) {
      const grouped = {};
      riders.forEach(r => {
        const cat = r.category || 'General';
        const wave = r.wave || 'Wave: 1';
        if (!grouped[cat]) grouped[cat] = {};
        if (!grouped[cat][wave]) grouped[cat][wave] = [];
        grouped[cat][wave].push(r);
      });

      const sortedCatKeys = Object.keys(grouped).sort((a, b) => {
        let ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
        if (ia === -1) ia = 99;
        if (ib === -1) ib = 99;
        return ia - ib;
      });

      sortedCatKeys.forEach(cat => {
        const catCard = document.createElement('div');
        catCard.className = 'table-card';

        const totalInCat = Object.values(grouped[cat]).reduce((acc, list) => acc + list.length, 0);

        const catTitle = document.createElement('div');
        catTitle.className = 'category-header';
        catTitle.innerHTML = `
          <span>${cat}</span>
          <span class="category-badge">${totalInCat} RIDERS</span>
        `;
        catCard.appendChild(catTitle);

        const waves = grouped[cat];
        const sortedWaveKeys = Object.keys(waves).sort();

        sortedWaveKeys.forEach(wKey => {
          const waveHeader = document.createElement('div');
          waveHeader.className = 'wave-divider';
          waveHeader.innerHTML = `<span>🚩</span> ${wKey.includes('Wave') ? wKey : `Wave: ${wKey}`}`;
          catCard.appendChild(waveHeader);

          const tableWrapper = document.createElement('div');
          tableWrapper.className = 'table-responsive-wrapper';

          const table = document.createElement('table');
          table.className = 'results-table';
          table.innerHTML = `
            <thead>
              <tr>
                <th style="width:45px;">PL</th>
                <th style="width:75px;">Plate #</th>
                <th>Rider Name</th>
                <th>Team / School</th>
                <th style="text-align:center;width:55px;">Div</th>
                <th style="text-align:center;width:55px;">Wave</th>
                <th style="text-align:center;width:55px;">Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          `;

          const tbody = table.querySelector('tbody');
          const ridersInWave = waves[wKey].sort((a, b) => {
            const pa = parseInt(a.pl) || parseInt(a.bib) || 0;
            const pb = parseInt(b.pl) || parseInt(b.bib) || 0;
            return pa - pb;
          });

          ridersInWave.forEach(r => {
            const isTarget = targetTeamKeywords.some(kw => r.team && r.team.toLowerCase().includes(kw));
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td style="color:var(--text-muted);font-weight:600;">${r.pl || '-'}</td>
              <td><span class="plate-number">#${r.no || r.bib}</span></td>
              <td><span class="rider-name">${r.name}</span></td>
              <td><span class="${isTarget ? 'team-name-lax' : 'team-name'}">${r.team}</span></td>
              <td style="text-align:center;"><span class="div-tag">D${r.div || '1'}</span></td>
              <td style="text-align:center;color:var(--text-muted);">${r.wv || '1'}</td>
              <td style="text-align:center;font-weight:700;color:var(--accent-red);">${r.return_val || '+'}</td>
            `;
            tbody.appendChild(tr);
          });

          tableWrapper.appendChild(table);
          catCard.appendChild(tableWrapper);
        });

        container.appendChild(catCard);
      });
    }

    function renderGroupedByTeam(riders, container) {
      const grouped = {};
      riders.forEach(r => {
        const team = r.team || 'Independent';
        if (!grouped[team]) grouped[team] = [];
        grouped[team].push(r);
      });

      const sortedTeams = Object.keys(grouped).sort();

      sortedTeams.forEach(team => {
        const teamCard = document.createElement('div');
        teamCard.className = 'table-card';

        const teamHeader = document.createElement('div');
        teamHeader.className = 'category-header';
        teamHeader.innerHTML = `
          <span>${team}</span>
          <span class="category-badge">${grouped[team].length} RIDERS</span>
        `;
        teamCard.appendChild(teamHeader);

        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'table-responsive-wrapper';

        const table = document.createElement('table');
        table.className = 'results-table';
        table.innerHTML = `
          <thead>
            <tr>
              <th style="width:75px;">Plate #</th>
              <th>Rider Name</th>
              <th>Category</th>
              <th style="text-align:center;width:55px;">Div</th>
              <th style="text-align:center;width:75px;">Wave</th>
              <th style="text-align:center;width:55px;">Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;

        const tbody = table.querySelector('tbody');
        const teamRiders = grouped[team].sort((a, b) => {
          let ia = categoryOrder.indexOf(a.category), ib = categoryOrder.indexOf(b.category);
          if (ia === -1) ia = 99;
          if (ib === -1) ib = 99;
          if (ia !== ib) return ia - ib;
          return (a.name || '').localeCompare(b.name || '');
        });

        teamRiders.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="plate-number">#${r.bib || r.no}</span></td>
            <td><span class="rider-name">${r.name}</span></td>
            <td><strong style="color:var(--text-main);">${r.category || ''}</strong></td>
            <td style="text-align:center;"><span class="div-tag">D${r.div || '1'}</span></td>
            <td style="text-align:center;color:var(--text-muted);">${r.wave || 'Wave 1'}</td>
            <td style="text-align:center;font-weight:700;color:var(--accent-red);">${r.return_val || '+'}</td>
          `;
          tbody.appendChild(tr);
        });

        tableWrapper.appendChild(table);
        teamCard.appendChild(tableWrapper);
        container.appendChild(teamCard);
      });
    }

    function setupAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      const intervalSec = parseInt(document.getElementById('autoRefreshInterval').value, 10);
      if (intervalSec > 0) {
        autoRefreshTimer = setInterval(fetchLiveRaceresultData, intervalSec * 1000);
      }
    }

    initTheme();
    renderRaceSwitcher();
    selectRace(0);
    setupAutoRefresh();
  </script>
</body>
</html>
